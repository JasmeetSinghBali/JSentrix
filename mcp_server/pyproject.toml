[project]
name = "mcp_server"
version = "1.0.0"
license = "GPL-3.0-only"
description = "jsentrix mcp_server"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "JasmeetSinghBali", email = "jasmeetbali.dev.2021@gmail.com" }
]
dependencies = [
    "anyio>=4.9.0",
    "confluent-kafka>=2.10.1",
    "docling>=2.32.0",
    "faker>=37.3.0",
    "fastapi>=0.115.12",
    "fpdf>=1.7.2",
    "langchain>=0.3.25",
    "langchain-core>=0.3.60",
    "langchain-huggingface>=0.2.0",
    "langchain-neo4j>=0.4.0",
    "llama-index>=0.12.36",
    "llama-index-core>=0.12.36",
    "llama-index-embeddings-huggingface>=0.5.4",
    "llama-index-llms-ollama>=0.5.4",
    "llama-index-vector-stores-neo4jvector>=0.3.0",
    "mcp[cli]>=1.8.1",
    "neo4j>=5.28.1",
    "opentelemetry-api>=1.34.0",
    "opentelemetry-instrumentation-fastapi>=0.55b0",
    "opentelemetry-sdk>=1.34.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "python-dotenv>=1.1.0",
    "qdrant-client[fastembed]>=1.14.2",
    "redis>=6.2.0",
    "sentence-transformers>=4.1.0",
    "transformers[torch]>=4.51.3",
]
[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_default_fixture_loop_scope = "function"

