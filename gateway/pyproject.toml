description = "jsentrix mcp-client-gateway to enable interaction between electron app and mcp_server"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "JasmeetSinghBali", email = "jasmeetbali.dev.2021@gmail.com" }
]
dependencies = [
